<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Racing Through Bulverde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: Saturday-morning arcade, loud and friendly
   IDEA: a Hill Country road-trip arcade cabinet
   PICTURE: the maze itself: asphalt roads, grass blocks, reflector dots
   COLOUR and TYPE: asphalt #22232b, grass #2f7d4b, sign yellow #ffd23f, Bungee + Nunito
   LAYOUT: thin HUD on top, the game board fills the rest, overlays for menus */
:root{color-scheme:dark;--bg:#14151b;--road:#22232b;--grass:#2f7d4b;--sign:#ffd23f;--hot:#ff6b35;--ink:#f6f3ea;--muted:#a9adbb}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{display:flex;flex-direction:column;align-items:center;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:640px;padding:8px 12px;gap:8px}
#hud .l{font-weight:800}#hud .r{text-align:right;font-weight:800}
#lvl{font-family:Bungee,system-ui;font-size:13px;color:var(--sign);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{display:block;font-size:11px;color:var(--muted);font-weight:600}
#lives{font-size:16px;letter-spacing:1px}
#pause{background:#2a2c38;color:var(--ink);font-size:15px;padding:0 12px;min-height:36px;border-radius:10px;margin-left:8px;vertical-align:middle}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;width:100%}
#pad{display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,48px);gap:6px;flex:none}
#pad button{padding:0;border-radius:16px;background:#2a2c38;color:var(--sign);font-size:24px;min-height:0}
#pad button:active{background:#3a3e52}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
#pad.hidden{display:none}
canvas{display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(circle at 50% 20%,#24324a 0%,#14151b 70%);text-align:center;padding:24px 18px;gap:12px;overflow-y:auto;touch-action:pan-y}
.overlay>:first-child{margin-top:auto}.overlay>:last-child{margin-bottom:auto}
.overlay.dim{background:rgba(14,15,20,.88)}
.hidden{display:none!important}
h1,h2{font-family:Bungee,system-ui;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(32px,9vw,48px);color:var(--sign);text-shadow:0 4px 0 #b5470f}
h2{font-size:34px;color:var(--sign)}
.sign{display:inline-block;background:var(--sign);color:#1b1b1b;font-family:Bungee,system-ui;font-size:13px;padding:4px 10px;border-radius:6px;border:2px solid #1b1b1b}
.sub{color:#d9d6cc;max-width:340px;margin:0}
button{font:inherit;font-weight:800;font-size:18px;min-height:44px;padding:10px 28px;border:0;border-radius:999px;background:var(--sign);color:#1a1a1a;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ghostbtn{background:transparent;color:var(--ink);border:2px solid #3a3d4c;font-size:15px}
.skins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:380px;padding-bottom:16px}
.skin{font-size:32px;width:58px;height:58px;border-radius:14px;background:#22273a;border:3px solid transparent;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.skin.sel{border-color:var(--sign);background:#2d3550}
.skin.locked{filter:grayscale(1);opacity:.4}
.skin small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}
#skinName{color:var(--muted);font-size:14px;min-height:20px}
.board{min-width:220px;background:#1c2030;border-radius:12px;padding:10px 16px;font-size:15px}
.board h3{margin:0 0 6px;font-family:Bungee,system-ui;font-size:13px;color:var(--hot)}
.board ol{margin:0;padding-left:22px;text-align:left}
.board li{display:flex;justify-content:space-between;gap:16px}
.board li span:last-child{font-variant-numeric:tabular-nums}
.big{font-family:Bungee,system-ui;font-size:44px;color:var(--ink)}
#unlockMsg{color:var(--sign);font-weight:800;min-height:0}
#nameRow{display:flex;gap:8px}
input{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:2px solid #3a3d4c;background:#11131a;color:var(--ink);width:150px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;background:#1c2030;border-radius:999px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--ink);font-size:15px;padding:8px 16px;min-height:40px}
.seg button.on{background:var(--sign);color:#1a1a1a}
#diffNote{font-size:13px;color:var(--muted);margin:-4px 0 0;min-height:18px}
.tiny{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="l"><span class="lab">Score</span><span id="score">0</span></div>
    <div id="lvl">Bulverde Rd</div>
    <div class="r"><span class="lab"><span id="diffLab">Pro</span> best <span id="best">0</span></span><span id="lives"></span><button id="pause" aria-label="Pause">⏸</button></div>
  </div>
  <div id="stage"><canvas id="game" aria-label="Game board"></canvas>
    <div id="pad"><button class="u" data-d="0,-1" aria-label="Up">▲</button><button class="l" data-d="-1,0" aria-label="Left">◀</button><button class="r" data-d="1,0" aria-label="Right">▶</button><button class="d" data-d="0,1" aria-label="Down">▼</button></div></div>
</div>

<div id="title" class="overlay">
  <span class="sign">Hill Country Arcade</span>
  <h1>Racing Through<br>Bulverde</h1>
  <p class="sub">Swipe or tap the arrows to steer. Grab every road light. Hit a ⚡ pad for a speed burst. Eat a 🥐 kolache and the critters run scared.</p>
  <div id="diffs" class="seg" role="group" aria-label="Difficulty"></div>
  <p id="diffNote"></p>
  <div id="skinName"></div>
  <div id="skins" class="skins"></div>
  <button id="playBtn">Let's Ride</button>
  <div id="boardT" class="board"></div>
  <div class="row"><button id="muteBtn" class="ghostbtn">🔊 Sound on</button></div>
  <p class="tiny">Keyboard works too: arrows or WASD, P to pause.</p>
</div>

<div id="over" class="overlay dim hidden">
  <h2 id="overTitle">Game Over</h2>
  <div id="finalScore" class="big">0</div>
  <div id="unlockMsg"></div>
  <form id="nameRow"><input id="nameIn" maxlength="8" placeholder="Your name" autocomplete="off"><button id="saveBtn" type="submit">Save</button></form>
  <div id="boardO" class="board"></div>
  <div class="row"><button id="againBtn">Play Again</button><button id="garageBtn" class="ghostbtn">Garage</button></div>
</div>

<div id="paused" class="overlay dim hidden">
  <h2>Paused</h2>
  <div class="row"><button id="resumeBtn">Resume</button><button id="quitBtn" class="ghostbtn">Quit</button></div>
</div>

<script>
{
// ====== EASY TO EDIT: names, levels, characters ======
const LEVEL_NAMES = ["Bulverde Rd","Smithson Valley Rd","FM 1863","Hwy 46","US 281 Rush Hour","Cibolo Creek","Spring Branch","Hill Country Finals"];
const BONUS = [
  {e:"🌮",n:"Taco Stop",p:300},{e:"🍦",n:"Ice Cream Run",p:500},{e:"🍕",n:"Pizza Night",p:700},
  {e:"🏈",n:"Friday Night Lights",p:1000},{e:"🍩",n:"Donut Run",p:1500},{e:"🏆",n:"Hill Country Champ",p:2500}];
const SKINS = [
  {e:"🚗",n:"Daily Driver",u:0},{e:"🛻",n:"Hill Country Truck",u:3000},{e:"🚲",n:"BMX Bandit",u:6000},
  {e:"🏎️",n:"Race Car",u:10000},{e:"🚜",n:"Turbo Tractor",u:16000},{e:"🛸",n:"UFO",u:25000}];
const CHASERS = [
  {e:"🐄",n:"Cow",ai:"chase",corner:[17,0]},{e:"🦌",n:"Deer",ai:"ahead",corner:[1,0]},
  {e:"🚌",n:"School Bus",ai:"wander",corner:[17,20]},{e:"🐓",n:"Rooster",ai:"shy",corner:[1,20]}];
const MAP_SRC = [
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.### # ###.####",
"   #.#       #.#   ",
"####.# ## ## #.####",
"    .  #GGG#  .    ",
"####.# ##### #.####",
"   #.#       #.#   ",
"####.# ##### #.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const BOOST_PADS = [[4,3],[14,3],[9,19],[4,13],[14,13]];
const DIFFS = {
  rookie:{n:"Rookie",note:"Slower critters, longer kolache time, 5 lives",spd:0.72,fr:1.6,lives:5,rel:1.6},
  pro:{n:"Pro",note:"Arcade speed, 3 lives",spd:1,fr:1,lives:3,rel:1},
  legend:{n:"Legend",note:"Fast critters, short kolache time. Bragging rights.",spd:1.15,fr:0.6,lives:3,rel:0.7}};
const COLS=19, ROWS=21, BONUS_SPOT=[9,11], PAD_H=172;
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

if(store.get("rtb_best_pro",null)==null){store.set("rtb_best_pro",store.get("rtb_best",0));store.set("rtb_board_pro",store.get("rtb_board",[]));}
let diff=store.get("rtb_diff","pro");if(!DIFFS[diff])diff="pro";
let best=0, board=[], skinIdx=store.get("rtb_skin",0), muted=store.get("rtb_mute",false), prevBestAll=0;
const D=()=>DIFFS[diff];
function loadDiff(){best=store.get("rtb_best_"+diff,0);board=store.get("rtb_board_"+diff,[]);}
const bestAll=()=>Math.max(0,...Object.keys(DIFFS).map(k=>k===diff?best:store.get("rtb_best_"+k,0)));
loadDiff();
if(!SKINS[skinIdx]||bestAll()<SKINS[skinIdx].u) skinIdx=0;

const cv=$("game"), ctx=cv.getContext("2d");
let ts=20, dpr=1, wallLayer=document.createElement("canvas");
let grid=[], dots=0, dotsEaten=0, playerStart=[9,15];
let state="title", stateT=0, time=0, ptime=0;
let score=0, lives=3, level=1, combo=0, frightT=0, modeT=0, mode="scatter", boostT=0, bonus=null, popups=[], prevBest=0, saved=false;
let player=null, ghosts=[], want=[0,0];

// ====== sound ======
let actx=null;
function beep(f,d,type="square",v=0.04,slide=0){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
let chompFlip=false;
const sfx={
  chomp(){chompFlip=!chompFlip;beep(chompFlip?520:420,0.05,"square",0.025)},
  power(){beep(300,0.35,"sawtooth",0.05,500)},
  eat(n){beep(500+n*150,0.18,"square",0.05,400)},
  boost(){beep(700,0.2,"triangle",0.06,600)},
  bonus(){beep(880,0.1,"square",0.05);setTimeout(()=>beep(1320,0.15,"square",0.05),90)},
  die(){beep(600,0.9,"sawtooth",0.06,-520)},
  clear(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"square",0.05),i*120))}
};

// ====== map helpers ======
function loadMap(){
  grid=MAP_SRC.map(r=>r.padEnd(COLS," ").split(""));
  dots=0;dotsEaten=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x];
    if(c==="."||c==="o")dots++;
    if(c==="P"){playerStart=[x,y];grid[y][x]=" ";}
  }
  buildWalls();
}
const wrapX=x=>(x+COLS)%COLS;
function cell(x,y){if(y<0||y>=ROWS)return"#";return grid[y][wrapX(x)];}
function playerBlocked(x,y){const c=cell(x,y);return c==="#"||c==="G"||(wrapX(x)===9&&y===8);}
function ghostBlocked(g,x,y){
  const c=cell(x,y); if(c==="#")return true;
  const house=c==="G"||(wrapX(x)===9&&y===8);
  return house&&!g.inHouse&&!g.eaten;
}
const pos=e=>[e.x+e.dx*e.t,e.y+e.dy*e.t];
const isPad=(x,y)=>BOOST_PADS.some(p=>p[0]===x&&p[1]===y);

// ====== entities ======
function resetEntities(){
  player={x:playerStart[0],y:playerStart[1],dx:0,dy:0,t:0,speed:6,face:-1};
  want=[0,0];
  const starts=[[9,7],[8,9],[9,9],[10,9]], gap=Math.max(1,3-0.3*(level-1))*D().rel;
  ptime=0;
  ghosts=CHASERS.map((c,i)=>({...c,x:starts[i][0],y:starts[i][1],dx:0,dy:0,t:0,speed:5,inHouse:i>0,eaten:false,fright:false,release:i*gap}));
  frightT=0;boostT=0;modeT=0;mode="scatter";bonus=null;combo=0;
}
function step(e,dt,arrive){
  if(!e.dx&&!e.dy){arrive(e,false);if(!e.dx&&!e.dy)return;}
  e.t+=e.speed*dt;
  let guard=0;
  while(e.t>=1&&guard++<4){
    e.t-=1;e.x=wrapX(e.x+e.dx);e.y+=e.dy;
    arrive(e,true);
    if(!e.dx&&!e.dy){e.t=0;break;}
  }
}
function reverse(e){e.x=wrapX(e.x+e.dx);e.y+=e.dy;e.dx=-e.dx;e.dy=-e.dy;e.t=1-e.t;}

function playerArrive(p,real){
  if(real){
    const c=grid[p.y][p.x];
    if(c==="."){grid[p.y][p.x]=" ";dots--;dotsEaten++;addScore(10);sfx.chomp();bonusCheck();}
    else if(c==="o"){grid[p.y][p.x]=" ";dots--;dotsEaten++;addScore(50);powerUp();bonusCheck();}
    if(isPad(p.x,p.y)){if(boostT<0.3)sfx.boost();boostT=2.2;popup(p.x,p.y,"BOOST!","#6ee7ff");}
  }
  if((want[0]||want[1])&&!playerBlocked(p.x+want[0],p.y+want[1])){p.dx=want[0];p.dy=want[1];}
  else if(playerBlocked(p.x+p.dx,p.y+p.dy)){p.dx=0;p.dy=0;}
  if(p.dx)p.face=p.dx;
}
function ghostTarget(g){
  if(g.eaten)return[9,9];
  if(g.inHouse)return[9,7];
  if(mode==="scatter")return g.corner;
  const px=player.x,py=player.y,d=Math.hypot(g.x-px,g.y-py);
  if(g.ai==="ahead")return[px+player.dx*4,py+player.dy*4];
  if(g.ai==="wander")return Math.random()<0.25?[Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS)]:[px,py];
  if(g.ai==="shy")return d>8?[px,py]:g.corner;
  return[px,py];
}
function ghostArrive(g){
  if(g.inHouse&&ptime<g.release){g.dx=g.dy=0;return;}
  if(g.eaten&&g.x===9&&g.y===9){g.eaten=false;g.fright=false;g.inHouse=true;g.release=0;}
  if(g.inHouse&&g.x===9&&g.y===7)g.inHouse=false;
  const dirs=[[0,-1],[-1,0],[0,1],[1,0]];
  const moving=g.dx||g.dy;
  let opts=dirs.filter(d=>!(moving&&d[0]===-g.dx&&d[1]===-g.dy)&&!ghostBlocked(g,g.x+d[0],g.y+d[1]));
  if(!opts.length)opts=dirs.filter(d=>!ghostBlocked(g,g.x+d[0],g.y+d[1]));
  if(!opts.length){g.dx=g.dy=0;return;}
  let pick;
  if(g.fright&&!g.eaten)pick=opts[Math.floor(Math.random()*opts.length)];
  else{
    const[tx,ty]=ghostTarget(g);let bd=1e9;
    for(const o of opts){const dd=(g.x+o[0]-tx)**2+(g.y+o[1]-ty)**2;if(dd<bd){bd=dd;pick=o;}}
  }
  g.dx=pick[0];g.dy=pick[1];
}
function powerUp(){
  frightT=Math.max(2.5,7-0.6*(level-1))*D().fr;combo=0;sfx.power();
  for(const g of ghosts){if(g.eaten)continue;g.fright=true;if((g.dx||g.dy)&&!g.inHouse)reverse(g);}
}
function bonusCheck(){
  if(dotsEaten===60||dotsEaten===140){const b=BONUS[Math.min(level-1,BONUS.length-1)];bonus={...b,t:9};}
}
function addScore(n){score+=n;if(score>best){best=score;store.set("rtb_best_"+diff,best);}}
function popup(x,y,txt,col="#ffd23f"){popups.push({x,y,txt,col,t:1.2});}

// ====== game flow ======
function setState(s){state=s;stateT=0;}
function startGame(){
  score=0;lives=D().lives;level=1;prevBest=best;prevBestAll=bestAll();saved=false;
  loadMap();resetEntities();setState("ready");
  $("title").classList.add("hidden");$("over").classList.add("hidden");$("paused").classList.add("hidden");
}
function die(){setState("dying");sfx.die();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function gameOver(){
  setState("over");
  $("finalScore").textContent=score.toLocaleString();
  $("overTitle").textContent=score>=prevBest&&score>0?"New Best!":"Game Over";
  const unlocked=SKINS.filter(s=>s.u>prevBestAll&&s.u<=bestAll());
  $("unlockMsg").textContent=unlocked.length?"Unlocked: "+unlocked.map(s=>s.e+" "+s.n).join(", "):"";
  const qualifies=score>0&&(board.length<5||score>board[board.length-1].s);
  $("nameRow").classList.toggle("hidden",!qualifies);
  $("nameIn").value=store.get("rtb_name","");
  renderBoard("boardO");
  $("over").classList.remove("hidden");
}
function update(dt){
  time+=dt;stateT+=dt;
  for(const p of popups)p.t-=dt;popups=popups.filter(p=>p.t>0);
  if(state==="ready"){if(stateT>1.6)setState("play");return;}
  if(state==="dying"){if(stateT>1.4){lives--;if(lives<=0)gameOver();else{resetEntities();setState("ready");}}return;}
  if(state==="clear"){if(stateT>2.2){level++;loadMap();resetEntities();setState("ready");}return;}
  if(state!=="play")return;
  ptime+=dt;
  if(frightT>0){frightT-=dt;if(frightT<=0)for(const g of ghosts)g.fright=false;}
  else{modeT+=dt;const len=mode==="scatter"?Math.max(2,7-level):20;if(modeT>len){modeT=0;mode=mode==="scatter"?"chase":"scatter";}}
  if(boostT>0)boostT-=dt;
  player.speed=Math.min(7.5,6+0.2*(level-1))*(boostT>0?1.6:1);
  if((player.dx||player.dy)&&want[0]===-player.dx&&want[1]===-player.dy)reverse(player);
  step(player,dt,playerArrive);
  for(const g of ghosts){
    const tunnel=g.y===9&&(g.x<4||g.x>14);
    g.speed=g.eaten?11:g.fright?3.2*Math.min(1,D().spd):(tunnel?2.8:Math.min(7.2,5+0.35*(level-1)))*D().spd;
    step(g,dt,ghostArrive);
  }
  const[px,py]=pos(player);
  if(bonus){
    bonus.t-=dt;
    if(bonus.t<=0)bonus=null;
    else if(Math.hypot(px-BONUS_SPOT[0],py-BONUS_SPOT[1])<0.6){addScore(bonus.p);popup(BONUS_SPOT[0],BONUS_SPOT[1],"+"+bonus.p+" "+bonus.n);sfx.bonus();bonus=null;}
  }
  for(const g of ghosts){
    if(g.eaten)continue;
    const[gx,gy]=pos(g);let ddx=Math.abs(px-gx);if(ddx>COLS/2)ddx=COLS-ddx;
    if(Math.hypot(ddx,py-gy)<0.65){
      if(g.fright){g.fright=false;g.eaten=true;combo++;const pts=200*2**(combo-1);addScore(pts);popup(gx,gy,"+"+pts);sfx.eat(combo);}
      else{die();return;}
    }
  }
  if(dots<=0){setState("clear");sfx.clear();addScore(500*level);}
}

// ====== drawing ======
function resize(){
  const hud=$("hud").getBoundingClientRect().height;
  const availW=Math.min(window.innerWidth-12,640);let availH=window.innerHeight-hud-16;
  const touch=window.matchMedia("(pointer:coarse)").matches||"ontouchstart" in window;
  const fitW=Math.floor(availW/COLS)*ROWS, showPad=touch||availH-fitW>PAD_H;
  $("pad").classList.toggle("hidden",!showPad);if(showPad)availH-=PAD_H;
  ts=Math.max(10,Math.floor(Math.min(availW/COLS,availH/ROWS)));
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=COLS*ts*dpr;cv.height=ROWS*ts*dpr;
  cv.style.width=COLS*ts+"px";cv.style.height=ROWS*ts+"px";
  buildWalls();
}
function buildWalls(){
  if(!grid.length)return;
  wallLayer.width=COLS*ts*dpr;wallLayer.height=ROWS*ts*dpr;
  const w=wallLayer.getContext("2d");w.setTransform(dpr,0,0,dpr,0,0);
  w.fillStyle="#22232b";w.fillRect(0,0,COLS*ts,ROWS*ts);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=MAP_SRC[y][x]||" ",X=x*ts,Y=y*ts;
    if(c==="#"){
      w.fillStyle="#2f7d4b";w.fillRect(X,Y,ts,ts);
      w.fillStyle="#4fae6f";const e=Math.max(2,ts*0.12),wall=(a,b)=>(MAP_SRC[b]||"")[a]==="#";
      if(!wall(x,y-1))w.fillRect(X,Y,ts,e);
      w.fillStyle="#1f5a35";
      if(!wall(x,y+1))w.fillRect(X,Y+ts-e,ts,e);
      if(!wall(x-1,y))w.fillRect(X,Y,e*0.6,ts);
      if(!wall(x+1,y))w.fillRect(X+ts-e*0.6,Y,e*0.6,ts);
      if((x*7+y*13)%9===0&&y>0&&y<ROWS-1){w.font=Math.floor(ts*0.7)+"px "+EMOJI;w.textAlign="center";w.textBaseline="middle";w.fillText((x+y)%2?"🌳":"🌵",X+ts/2,Y+ts/2+1);}
    }else if(c==="G"){w.fillStyle="#3a2f4a";w.fillRect(X,Y,ts,ts);}
  }
  w.fillStyle="#ff7eb6";w.fillRect(9*ts,8*ts+ts*0.42,ts,ts*0.16);
  for(const[x,y]of BOOST_PADS){
    w.fillStyle="rgba(110,231,255,.18)";w.fillRect(x*ts+1,y*ts+1,ts-2,ts-2);
    w.strokeStyle="#6ee7ff";w.lineWidth=Math.max(1.5,ts*0.08);w.strokeRect(x*ts+2,y*ts+2,ts-4,ts-4);
  }
}
function emoji(ch,x,y,size,flip=false,alpha=1,rot=0){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
  ctx.font=Math.floor(size)+"px "+EMOJI;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ch,0,size*0.05);ctx.restore();
}
function pill(txt,cx,cy,col="#ffd23f"){
  ctx.font="800 "+Math.floor(ts*0.75)+"px Bungee,system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  const w=ctx.measureText(txt).width+ts;ctx.fillStyle="rgba(10,10,16,.85)";ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(cx-w/2,cy-ts*0.6,w,ts*1.2,ts*0.6);else ctx.rect(cx-w/2,cy-ts*0.6,w,ts*1.2);
  ctx.fill();ctx.fillStyle=col;ctx.fillText(txt,cx,cy+1);
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,COLS*ts,ROWS*ts);
  if(!grid.length)return;
  ctx.drawImage(wallLayer,0,0,COLS*ts,ROWS*ts);
  for(const[x,y]of BOOST_PADS)emoji("⚡",(x+.5)*ts,(y+.5)*ts,ts*0.55,false,0.5+0.3*Math.sin(time*6));
  ctx.fillStyle="#ffe27a";
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x];
    if(c==="."){ctx.beginPath();ctx.arc((x+.5)*ts,(y+.5)*ts,Math.max(1.5,ts*0.11),0,Math.PI*2);ctx.fill();}
    else if(c==="o")emoji("🥐",(x+.5)*ts,(y+.5)*ts,ts*(0.8+0.12*Math.sin(time*8)));
  }
  if(bonus&&(bonus.t>2||Math.floor(time*6)%2))emoji(bonus.e,(BONUS_SPOT[0]+.5)*ts,(BONUS_SPOT[1]+.5)*ts,ts*0.9);
  const flashing=frightT>0&&frightT<2&&Math.floor(time*8)%2;
  for(const g of ghosts){
    const[gx,gy]=pos(g),cx=(gx+.5)*ts,cy=(gy+.5)*ts;
    if(g.eaten){emoji("👀",cx,cy,ts*0.7);continue;}
    if(g.fright){
      ctx.fillStyle=flashing?"#ffffff":"#3d6bff";ctx.beginPath();ctx.arc(cx,cy,ts*0.5,0,Math.PI*2);ctx.fill();
      emoji(g.e,cx,cy,ts*0.75,g.dx>0,0.8);
    }else{
      const bob=g.inHouse&&ptime<g.release?Math.sin(time*6+g.x)*ts*0.08:0;
      emoji(g.e,cx,cy+bob,ts*0.95,g.dx>0);
    }
  }
  const[px,py]=pos(player),pcx=(px+.5)*ts,pcy=(py+.5)*ts;
  if(boostT>0){ctx.fillStyle="rgba(110,231,255,.35)";ctx.beginPath();ctx.arc(pcx-player.dx*ts*0.5,pcy-player.dy*ts*0.5,ts*0.4,0,Math.PI*2);ctx.fill();}
  if(state==="dying"){const k=Math.max(0,1-stateT/1.2);emoji(SKINS[skinIdx].e,pcx,pcy,ts*k,false,k,stateT*12);}
  else emoji(SKINS[skinIdx].e,pcx,pcy,ts*0.95,player.face>0);
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.t*1.5);ctx.font="800 "+Math.floor(ts*0.6)+"px Nunito,system-ui";ctx.textAlign="center";
    ctx.lineWidth=3;ctx.strokeStyle="#000";const yy=(p.y+.5)*ts-(1.2-p.t)*ts;
    ctx.strokeText(p.txt,(p.x+.5)*ts,yy);ctx.fillStyle=p.col;ctx.fillText(p.txt,(p.x+.5)*ts,yy);ctx.globalAlpha=1;
  }
  if(state==="ready"){pill(LEVEL_NAMES[(level-1)%LEVEL_NAMES.length],COLS*ts/2,11.5*ts,"#ffffff");pill("READY!",COLS*ts/2,13.5*ts);}
  if(state==="clear"){pill("STREET CLEARED!",COLS*ts/2,11.5*ts);if(Math.floor(time*4)%2)emoji("🎉",COLS*ts/2,9.5*ts,ts*1.6);}
}
let hudCache="";
function hud(){
  const lvl=LEVEL_NAMES[(level-1)%LEVEL_NAMES.length]+(level>LEVEL_NAMES.length?" +"+Math.floor((level-1)/LEVEL_NAMES.length):"");
  const key=score+"|"+best+"|"+lives+"|"+lvl+"|"+skinIdx+"|"+diff;
  if(key===hudCache)return;hudCache=key;
  $("diffLab").textContent=D().n;$("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString();
  $("lvl").textContent="Lvl "+level+" · "+lvl;
  $("lives").textContent=SKINS[skinIdx].e.repeat(Math.max(0,lives-1));
}

// ====== menus ======
function renderSkins(){
  $("skins").innerHTML=SKINS.map((s,i)=>{
    const locked=bestAll()<s.u;
    return `<button class="skin${i===skinIdx?" sel":""}${locked?" locked":""}" data-i="${i}" aria-label="${esc(s.n)}">${s.e}<small>${locked?"🔒 "+s.u.toLocaleString():esc(s.n.split(" ")[0])}</small></button>`;
  }).join("");
  $("skinName").textContent="Your ride: "+SKINS[skinIdx].n;
}
function renderBoard(id){
  $(id).innerHTML=`<h3>Top Drivers · ${esc(D().n)}</h3>`+(board.length?`<ol>${board.map(r=>`<li><span>${esc(r.n)}</span><span>${Number(r.s).toLocaleString()}</span></li>`).join("")}</ol>`:`<p class="tiny">No scores yet. Be the first.</p>`);
}
function renderDiffs(){
  $("diffs").innerHTML=Object.entries(DIFFS).map(([k,d])=>`<button data-k="${k}" class="${k===diff?"on":""}" aria-pressed="${k===diff}">${esc(d.n)}</button>`).join("");
  $("diffNote").textContent=D().note;
}
function showTitle(){setState("title");renderDiffs();renderSkins();renderBoard("boardT");$("over").classList.add("hidden");$("paused").classList.add("hidden");$("title").classList.remove("hidden");}
function setMuteLabel(){$("muteBtn").textContent=muted?"🔇 Sound off":"🔊 Sound on";}
let pausedFrom=null;
function pause(){if(state==="play"||state==="ready"){pausedFrom=state;setState("paused");$("paused").classList.remove("hidden");}}
function resume(){if(state==="paused"){state=pausedFrom;$("paused").classList.add("hidden");}}

$("skins").addEventListener("click",e=>{const b=e.target.closest(".skin");if(!b)return;const i=+b.dataset.i;if(bestAll()>=SKINS[i].u){skinIdx=i;store.set("rtb_skin",i);renderSkins();beep(660,0.08,"square",0.04);}else beep(160,0.15,"square",0.04);});
$("diffs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;diff=b.dataset.k;store.set("rtb_diff",diff);loadDiff();hudCache="";renderDiffs();renderBoard("boardT");beep(560,0.06,"square",0.04);});
$("playBtn").addEventListener("click",()=>{beep(440,0.05,"square",0.001);startGame();});
$("againBtn").addEventListener("click",startGame);
$("garageBtn").addEventListener("click",showTitle);
$("muteBtn").addEventListener("click",()=>{muted=!muted;store.set("rtb_mute",muted);setMuteLabel();});
$("pause").addEventListener("click",()=>state==="paused"?resume():pause());
$("resumeBtn").addEventListener("click",resume);
$("quitBtn").addEventListener("click",showTitle);
$("nameRow").addEventListener("submit",e=>{
  e.preventDefault();if(saved)return;
  const n=($("nameIn").value.trim()||"Driver").slice(0,8);store.set("rtb_name",n);
  board.push({n,s:score});board.sort((a,b)=>b.s-a.s);board=board.slice(0,5);store.set("rtb_board_"+diff,board);
  saved=true;$("nameRow").classList.add("hidden");renderBoard("boardO");
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause();});

// ====== input ======
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="p"||e.key==="P"||e.key==="Escape"){state==="paused"?resume():pause();return;}
  const d=KEYS[e.key];if(d){want=d;e.preventDefault();}
});
let tStart=null;
const inUI=e=>e.target.closest&&e.target.closest(".overlay,button,input");
window.addEventListener("touchstart",e=>{if(inUI(e))return;const t=e.touches[0];tStart=[t.clientX,t.clientY];e.preventDefault();},{passive:false});
window.addEventListener("touchmove",e=>{
  if(!tStart||inUI(e))return;e.preventDefault();
  const t=e.touches[0],dx=t.clientX-tStart[0],dy=t.clientY-tStart[1];
  if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
  want=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
  tStart=[t.clientX,t.clientY];
},{passive:false});
window.addEventListener("touchend",()=>{tStart=null;});
$("pad").addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b)return;e.preventDefault();want=b.dataset.d.split(",").map(Number);});

// ====== loop ======
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state!=="paused")update(dt);else time+=dt;
  draw();hud();requestAnimationFrame(frame);
}
window.addEventListener("resize",resize);
loadMap();resetEntities();resize();setMuteLabel();showTitle();
requestAnimationFrame(frame);
}
</script>
